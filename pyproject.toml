[project]
name = "whatsapp-automation"
version = "0.1.0"
description = "Single-user WhatsApp Web automation platform."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "selenium>=4.0.0",
    "webdriver-manager>=3.8.0",
    "sqlalchemy>=2.0",
    "alembic>=1.8",
    "streamlit>=1.30",
    "typer[all]>=0.9",
    "apscheduler>=3.10",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "pytest-asyncio>=0.21",
    "ruff",
    "black",
    "mypy",
]

[project.scripts]
whatsapp-automation = "whatsapp_automation.cli.main:app"
whatsapp-automation-ui = "whatsapp_automation.ui.run:main"
whatsapp-automation-scheduler = "whatsapp_automation.scheduler.scheduler:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
